services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scholarmate_db}
      POSTGRES_USER: ${SCHOLARMATE_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${SCHOLARMATE_DB_PASSWORD:?Set SCHOLARMATE_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  ml-service:
    build:
      context: ./scolarmate-backend/ml-service
    restart: unless-stopped
    environment:
      SCHOLARMATE_EMBEDDING_MODEL: ${SCHOLARMATE_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
    expose:
      - "8000"
    volumes:
      - ml-model-cache:/home/appuser/.cache/huggingface

  backend:
    build:
      context: ./scolarmate-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-scholarmate_db}
      SCHOLARMATE_DB_USERNAME: ${SCHOLARMATE_DB_USERNAME:-postgres}
      SCHOLARMATE_DB_PASSWORD: ${SCHOLARMATE_DB_PASSWORD:?Set SCHOLARMATE_DB_PASSWORD in .env}
      SCHOLARMATE_ML_BASE_URL: http://ml-service:8000
      SCHOLARMATE_DOCUMENT_STORAGE_DIR: /app/data/profile-documents
      SCHOLARMATE_SCRAPER_SCHEDULE_ENABLED: ${SCHOLARMATE_SCRAPER_SCHEDULE_ENABLED:-true}
      SCHOLARMATE_SCRAPER_INITIAL_DELAY_MS: ${SCHOLARMATE_SCRAPER_INITIAL_DELAY_MS:-30000}
      SCHOLARMATE_SCRAPER_MAX_CONCURRENT_SOURCES: ${SCHOLARMATE_SCRAPER_MAX_CONCURRENT_SOURCES:-1}
      TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started
    expose:
      - "8082"
    volumes:
      - profile-documents:/app/data/profile-documents

  frontend:
    build:
      context: ./SchlorMate/SchlorMate
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:8080"

volumes:
  postgres-data:
  ml-model-cache:
  profile-documents:
