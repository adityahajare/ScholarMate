services:
  - type: web
    runtime: docker
    name: scholarmate-ml
    rootDir: scolarmate-backend/ml-service
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: SCHOLARMATE_ENABLE_SEMANTIC_MODEL
        value: "false"

  - type: web
    runtime: static
    name: scholarmate-frontend
    rootDir: SchlorMate/SchlorMate
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
