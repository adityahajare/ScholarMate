services:
  - type: web
    runtime: static
    name: scholarmate-frontend
    rootDir: SchlorMateFrontend/SchlorMate
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
