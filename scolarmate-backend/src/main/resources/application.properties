spring.application.name=scolarmate-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/scholarmate_db}
spring.datasource.username=${SCHOLARMATE_DB_USERNAME:postgres}
spring.datasource.password=${SCHOLARMATE_DB_PASSWORD:}

scholarmate.jwt.secret=${SCHOLARMATE_JWT_SECRET:scholarmate-super-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256-security}
scholarmate.jwt.expiration-ms=${SCHOLARMATE_JWT_EXPIRATION_MS:900000}
scholarmate.jwt.access-expiration-ms=${SCHOLARMATE_JWT_ACCESS_EXPIRATION_MS:900000}
scholarmate.jwt.refresh-expiration-ms=${SCHOLARMATE_JWT_REFRESH_EXPIRATION_MS:604800000}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8082}
scholarmate.frontend-url=${SCHOLARMATE_FRONTEND_URL:http://localhost:5173,https://schlor-mate.vercel.app,https://scholarmate-frontend.onrender.com,https://scholar-mate-xi.vercel.app,https://scholar-mate-7kxx.vercel.app}
scholarmate.sources.initialize=${SCHOLARMATE_SOURCES_INITIALIZE:true}

scholarmate.scraper.poll-interval-ms=18000000
# Keep catalog refresh enabled by default so a new deployment does not remain
# limited to manually seeded scholarship records. Override with the environment
# variable when an instance should not perform outbound scraping.
scholarmate.scraper.schedule.enabled=${SCHOLARMATE_SCRAPER_SCHEDULE_ENABLED:true}
scholarmate.scraper.initial-delay-ms=${SCHOLARMATE_SCRAPER_INITIAL_DELAY_MS:30000}
scholarmate.scraper.max-concurrent-sources=${SCHOLARMATE_SCRAPER_MAX_CONCURRENT_SOURCES:1}
scholarmate.ml.base-url=${SCHOLARMATE_ML_BASE_URL:http://localhost:8000}
scholarmate.ocr.tessdata-path=${TESSDATA_PREFIX:/usr/share/tesseract-ocr/5/tessdata}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
scholarmate.documents.storage-dir=${SCHOLARMATE_DOCUMENT_STORAGE_DIR:./data/profile-documents}
