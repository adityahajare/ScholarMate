spring.application.name=scolarmate-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/scholarmate_db
spring.datasource.username=${SCHOLARMATE_DB_USERNAME:postgres}
spring.datasource.password=${SCHOLARMATE_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8082
scholarmate.frontend-url=${SCHOLARMATE_FRONTEND_URL:http://localhost:5173}
scholarmate.sources.initialize=${SCHOLARMATE_SOURCES_INITIALIZE:true}

scholarmate.scraper.poll-interval-ms=18000000
scholarmate.scraper.schedule.enabled=${SCHOLARMATE_SCRAPER_SCHEDULE_ENABLED:false}
scholarmate.scraper.initial-delay-ms=${SCHOLARMATE_SCRAPER_INITIAL_DELAY_MS:300000}
scholarmate.scraper.max-concurrent-sources=${SCHOLARMATE_SCRAPER_MAX_CONCURRENT_SOURCES:6}
scholarmate.ml.base-url=${SCHOLARMATE_ML_BASE_URL:http://localhost:8000}
scholarmate.ocr.tessdata-path=${TESSDATA_PREFIX:C:/Program Files/Tesseract-OCR/tessdata}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
scholarmate.documents.storage-dir=${SCHOLARMATE_DOCUMENT_STORAGE_DIR:./data/profile-documents}
