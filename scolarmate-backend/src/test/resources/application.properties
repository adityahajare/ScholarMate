spring.application.name=scolarmate-backend-test

spring.datasource.url=jdbc:postgresql://127.0.0.1:5435/scholarmate_db
spring.datasource.username=postgres
spring.datasource.password=change-me
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

scholarmate.jwt.secret=scholarmate-super-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256-security
scholarmate.jwt.expiration-ms=900000
scholarmate.scraper.schedule.enabled=false
